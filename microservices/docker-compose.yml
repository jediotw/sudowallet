services:

  # =========================
  # Infrastructure
  # =========================

  mysql:
    image: mysql:8.0
    container_name: sudowallet-mysql-ms

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sudowallet
      MYSQL_USER: sudowallet_user
      MYSQL_PASSWORD: sudowallet_password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      # Creates sudowallet_{user,auth,wallet,transaction,payment} on first boot.
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

    networks:
      - sudowallet-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sudowallet-redis-ms

    ports:
      - "6379:6379"

    networks:
      - sudowallet-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sudowallet-mailhog-ms

    ports:
      - "1025:1025"
      - "8025:8025"

    networks:
      - sudowallet-network

    restart: always

  # =========================
  # Database Migrations
  # =========================

  # Applies each service's migrations to its own database in dependency order,
  # then exits. Application services wait for this to complete before starting.
  migrate:
    image: migrate/migrate:v4.18.1
    container_name: sudowallet-migrate-ms

    volumes:
      - ./:/migrations
      - ./scripts/migrate.sh:/migrate.sh:ro

    entrypoint: ["/bin/sh", "/migrate.sh"]

    environment:
      DB_USER: sudowallet_user
      DB_PASSWORD: sudowallet_password
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sudowallet

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - sudowallet-network

    restart: "no"

  # =========================
  # Application Services
  # =========================

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/dockerfile

    container_name: sudowallet-api-gateway-ms

    ports:
      - "8080:8080"

    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8084
      WALLET_SERVICE_URL: http://wallet-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8086
      PAYMENT_SERVICE_URL: http://payment-service:8083

    networks:
      - sudowallet-network

    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile

    container_name: sudowallet-auth-service-ms

    ports:
      - "8081:8081"

    environment:
      PORT: 8081

      DB_USER: sudowallet_user
      DB_PASSWORD: sudowallet_password
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sudowallet_auth

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_SECRET: super-secret-key-change-this-in-production

      USER_SERVICE_URL: http://user-service:8084

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    networks:
      - sudowallet-network

    restart: unless-stopped

  wallet-service:
    build:
      context: .
      dockerfile: wallet-service/Dockerfile

    container_name: sudowallet-wallet-service-ms

    ports:
      - "8082:8082"

    environment:
      PORT: 8082

      DB_USER: sudowallet_user
      DB_PASSWORD: sudowallet_password
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sudowallet_wallet

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_SECRET: super-secret-key-change-this-in-production

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    networks:
      - sudowallet-network

    restart: unless-stopped

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile

    container_name: sudowallet-transaction-service-ms

    ports:
      - "8086:8086"

    environment:
      PORT: 8086

      DB_USER: sudowallet_user
      DB_PASSWORD: sudowallet_password
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sudowallet_transaction

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_SECRET: super-secret-key-change-this-in-production

      USER_SERVICE_URL: http://user-service:8084
      WALLET_SERVICE_URL: http://wallet-service:8082

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    networks:
      - sudowallet-network

    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile

    container_name: sudowallet-user-service-ms

    ports:
      - "8084:8084"

    environment:
      PORT: 8084

      DB_USER: sudowallet_user
      DB_PASSWORD: sudowallet_password
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sudowallet_user

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_SECRET: super-secret-key-change-this-in-production

      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: sudowallet@localhost
      OTP_SECRET: otp-secret-change-this-in-production

      WALLET_SERVICE_URL: http://wallet-service:8082

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    networks:
      - sudowallet-network

    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile

    container_name: sudowallet-payment-service-ms

    ports:
      - "8083:8083"

    environment:
      PORT: 8083

      DB_USER: sudowallet_user
      DB_PASSWORD: sudowallet_password
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sudowallet_payment

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_SECRET: super-secret-key-change-this-in-production

      WALLET_SERVICE_URL: http://wallet-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8086

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    networks:
      - sudowallet-network

    restart: unless-stopped

# =========================
# Volumes
# =========================

volumes:
  mysql_data:
  mongo_data:

# =========================
# Networks
# =========================

networks:
  sudowallet-network:
    driver: bridge