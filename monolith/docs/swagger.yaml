basePath: /api/v1
definitions:
  dto.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  errors.AppError:
    properties:
      code:
        type: string
      message:
        type: string
      statusCode:
        type: integer
    type: object
  model.User:
    properties:
      created_at:
        type: string
      deleted_at:
        description: DeletedAt is often a *time.Time so nil means "not deleted".
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a server for my Go application.
  title: wallet API
  version: "1.0"
paths:
  /users/register:
    post:
      consumes:
      - application/json
      description: Creates a user account and an associated wallet. Returns the created
        user.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/errors.AppError'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/errors.AppError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.AppError'
      summary: Register a new user
      tags:
      - users
swagger: "2.0"
