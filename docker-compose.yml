services:
  mysql:
    image: mysql:8.0
    container_name: sudowallet-mysql

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sudowallet
      MYSQL_USER: sudowallet_user
      MYSQL_PASSWORD: sudowallet_password
    
    ports:
      - 3306:3306
    volumes: 
      - mysql-data:/var/lib/mysql
    restart: always
  
volumes:
 mysql-data: