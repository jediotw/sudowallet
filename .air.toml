root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Binary to run after build
  bin = "./tmp/main"
  # Build command - points to your monolith entrypoint
  cmd = "go build -o ./tmp/main ./monolith/cmd/main.go"
  # Args to pass to the binary (e.g. ["--debug"] if needed)
  args_bin = []
  # Extra command to run before build (uncomment if you use swag)
  # pre_cmd = ["swag init -g monolith/cmd/main.go -o monolith/docs --parseDependency --parseInternal"]
  delay = 1000
  exclude_dir = ["tmp", "vendor", "uploads", "monolith/docs", ".git", ".idea"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["monolith"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = ["go.mod", "go.sum"]
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
